<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KDP Email Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-neobrutalism">
  <nav class="navbar">
    <div class="logo">
      <span class="logo-bright">BRIGHT</span><span class="logo-dot">.</span><span class="logo-stories">STORIES</span>
    </div>
    <div class="nav-meta" id="syncMeta">Loading…</div>
  </nav>

  <header class="hero">
    <p class="eyebrow">KDP EMAIL TRACKER</p>
    <h1>KDP Email Dashboard</h1>
    <p class="hero-sub">Bright Mindful Pages · Content Review Monitor</p>
  </header>

  <section class="stats" id="stats"></section>

  <section class="filters">
    <input id="q" type="search" placeholder="Search subject, summary, book code…" />
    <select id="status">
      <option value="">All statuses</option>
      <option>Approved</option>
      <option>Rejected</option>
      <option>Review</option>
      <option>Published</option>
      <option>Action Required</option>
      <option>Info</option>
      <option>N/A</option>
    </select>
    <select id="type">
      <option value="">All types</option>
      <option>Alert</option>
      <option>Notification</option>
      <option>Review</option>
      <option>Publishing</option>
      <option>Payment</option>
      <option>Metadata</option>
      <option>Account</option>
      <option>Other</option>
    </select>
  </section>

  <section id="list" class="list"></section>

  <script src="app.js"></script>
</body>
</html>
